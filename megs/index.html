<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Many Megs</title>
<meta name="theme-color" content="#8a2be2">
<meta property="og:title" content="The Many Megs">
<meta property="og:description" content="Megan, doing the rounds. 🎤">
<meta property="og:image" content="https://cooptowntrain.github.io/gem/megs/og-megs.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:url" content="https://cooptowntrain.github.io/gem/megs/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Many Megs">
<meta name="twitter:description" content="Megan, doing the rounds. 🎤">
<meta name="twitter:image" content="https://cooptowntrain.github.io/gem/megs/og-megs.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:linear-gradient(160deg,#ff2d95,#8a2be2 55%,#22c9ff);background-attachment:fixed;font-family:'Poppins',system-ui,sans-serif;color:#fff;min-height:100vh;padding:34px 16px 70px}
 .h{text-align:center;max-width:900px;margin:0 auto 26px}
 .h h1{font-size:clamp(30px,7vw,50px);font-weight:800;text-shadow:2px 3px 0 rgba(0,0,0,.18);margin-bottom:6px}
 .h p{font-size:15px;opacity:.95}
 .grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;max-width:1200px;margin:0 auto}
 .card{flex:0 0 250px;max-width:100%;background:rgba(12,6,26,.28);border:1px solid rgba(255,255,255,.32);border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.28);transition:transform .12s ease}
 .card:hover{transform:translateY(-4px)}
 .shot{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;cursor:zoom-in}
 .cap{padding:13px 14px 16px;text-align:center}
 .cap .n{font-size:19px;font-weight:800}
 #lb{position:fixed;inset:0;background:rgba(6,3,12,.96);display:none;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;padding:14px}
 #lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
 #lb .hint{position:fixed;top:14px;right:18px;font-size:13px;opacity:.7;font-weight:600}
</style></head><body>
 <div class="h"><h1>🎤 The Many Megs</h1><p>Tap any picture to see it full screen.</p></div>
 <div class="grid" id="grid"></div>
 <div id="lb"><img id="lbimg" src="" alt=""><div class="hint">tap to close</div></div>
<script>
 var megs=[
   {f:'1-meg-ryan.jpg',n:'Meg Ryan'},
   {f:'2-meg-griffin.jpg',n:'Meg Griffin'},
   {f:'3-m3gan.jpg',n:'M3GAN'},
   {f:'4-megan-fox.jpg',n:'Megan Fox'},
   {f:'5-megan-mullally.jpg',n:'Megan Mullally'},
   {f:'6-meghan-markle.jpg',n:'Meghan Markle'},
   {f:'7-the-meg.jpg',n:'The Meg'}
 ];
 document.getElementById('grid').innerHTML=megs.map(function(m){
   return '<div class="card"><img class="shot" src="'+m.f+'" alt="'+m.n+'" loading="lazy"><div class="cap"><div class="n">'+m.n+'</div></div></div>';
 }).join('');
 var lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg');
 function openLb(s){lbimg.src=s;lb.style.display='flex';if(lb.requestFullscreen){lb.requestFullscreen().catch(function(){});}}
 function closeLb(){lb.style.display='none';lbimg.src='';if(document.fullscreenElement){document.exitFullscreen().catch(function(){});}}
 document.querySelectorAll('.shot').forEach(function(img){img.addEventListener('click',function(){openLb(img.src);});});
 lb.addEventListener('click',closeLb);
 document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});
 document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)lb.style.display='none';});
</script>
</body></html>
