<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#ff2d95,#8a2be2 55%,#22c9ff);font-family:'Poppins',system-ui,sans-serif;color:#fff;min-height:100vh;padding:34px 16px 60px}
.h{text-align:center;max-width:900px;margin:0 auto 24px}
.h h1{font-size:clamp(30px,7vw,46px);font-weight:800;text-shadow:2px 3px 0 rgba(0,0,0,.18);margin:0 0 6px}
.h p{font-size:15px;opacity:.95;margin:0}
.grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;max-width:1180px;margin:0 auto}
.card{width:340px;max-width:100%;background:rgba(12,6,26,.26);border:1px solid rgba(255,255,255,.35);border-radius:20px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.imgbox{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#160b28}
.imgbox .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(22px) brightness(.55);transform:scale(1.2)}
.imgbox img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
.cap{padding:13px 16px 17px;text-align:center}
.cap .n{font-size:21px;font-weight:800}
.cap .s{font-size:14px;opacity:.9;margin-top:2px}
</style></head><body>
<div class="h"><h1>🎤 The Many Megs</h1><p>Megan, doing the rounds.</p></div>
<div class="grid">
  <div class="card"><div class="imgbox"><div class="bg" style="background-image:url(meg-ryan.jpg)"></div><img src="meg-ryan.jpg" alt="Megan as Meg Ryan"></div><div class="cap"><div class="n">Meg Ryan</div><div class="s">When Harry Met Sally</div></div></div>
  <div class="card"><div class="imgbox"><div class="bg" style="background-image:url(meg-griffin.jpg)"></div><img src="meg-griffin.jpg" alt="Megan as Meg Griffin"></div><div class="cap"><div class="n">Meg Griffin</div><div class="s">Family Guy</div></div></div>
  <div class="card"><div class="imgbox"><div class="bg" style="background-image:url(mm-m3gan.png)"></div><img src="mm-m3gan.png" alt="M3GAN"></div><div class="cap"><div class="n">M3GAN</div><div class="s">The movie</div></div></div>
</div></body></html>
