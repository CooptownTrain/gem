<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M3GAN IS IN TOWN — Megan's Karaoke Party</title>
<meta name="theme-color" content="#8a2be2">
<meta property="og:title" content="M3GAN IS IN TOWN">
<meta property="og:description" content="It's a karaoke party. Friday, July 31 · 7:30PM · The Cooper/Safer House.">
<meta property="og:image" content="https://cooptowntrain.github.io/gem/og-face.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:url" content="https://cooptowntrain.github.io/gem/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="M3GAN IS IN TOWN">
<meta name="twitter:description" content="It's a karaoke party. Friday, July 31 · 7:30PM.">
<meta name="twitter:image" content="https://cooptowntrain.github.io/gem/og-face.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#ffd24a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:#8a2be2;font-family:'Barlow',system-ui,-apple-system,sans-serif;color:#fff;display:flex;justify-content:center;-webkit-text-size-adjust:100%}
  .card{width:100%;max-width:460px;min-height:100svh;position:relative;overflow:hidden;display:flex;flex-direction:column;
    background:linear-gradient(150deg,#ff2d95 0%,#8a2be2 46%,#22c9ff 100%)}
  .blob{position:absolute;border-radius:50%;z-index:1;filter:blur(1px);opacity:.42}
  .b1{width:190px;height:190px;background:radial-gradient(circle,#ff7ac1,transparent 70%);top:52%;right:-46px}
  .b2{width:180px;height:180px;background:radial-gradient(circle,#5ce0ff,transparent 70%);bottom:40px;left:-50px}

  /* WHOLE poster, nothing cut (contain) */
  .hero{position:relative;width:100%;flex:0 0 58svh;z-index:2;
    background-image:url("m3gan.png");background-size:contain;background-position:center top;background-repeat:no-repeat;background-color:#0c0512}

  .content{position:relative;z-index:3;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 20px 18px;background:linear-gradient(to bottom,rgba(12,5,18,.5),transparent 12%)}
  .sp{flex:1 1 0;min-height:3px;max-height:18px}

  .msub{font-weight:300;font-size:clamp(24px,7.4vw,29px);line-height:1;letter-spacing:.16em;text-shadow:0 2px 10px rgba(0,0,0,.55)}
  .h2{font-weight:400;font-size:clamp(12px,3.7vw,14px);color:#ffe9a8;letter-spacing:.05em;margin-top:5px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .kara{font-weight:500;font-size:clamp(18px,5.6vw,22px);letter-spacing:.09em;margin-top:5px;text-shadow:0 1px 6px rgba(0,0,0,.5)}

  .venuecard{width:100%;background:rgba(12,6,26,.5);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:11px 14px;backdrop-filter:blur(4px)}
  .venue{font-weight:300;font-size:clamp(16px,4.9vw,19px);line-height:1.08;letter-spacing:.02em}
  .addr{font-weight:500;font-size:clamp(12px,3.6vw,13px);margin-top:2px;opacity:.95}
  .time{font-weight:300;font-size:clamp(15px,4.4vw,17px);color:var(--gold);letter-spacing:.03em;margin-top:5px}

  .count{display:flex;gap:8px;justify-content:center}
  .u{min-width:52px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45)}
  .num{font-weight:300;font-size:clamp(21px,6.4vw,25px);font-variant-numeric:tabular-nums;line-height:1}
  .lab{font-size:8px;letter-spacing:.14em;font-weight:500;opacity:.9;margin-top:4px}
  .partyMsg{display:none;font-weight:300;font-size:clamp(22px,6.6vw,30px);letter-spacing:.06em}
  .go .count{display:none}.go .partyMsg{display:block}

  /* SMALLER catalog: compact centered pill */
  .cat{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-family:'Poppins';font-size:13px;font-weight:700;
    padding:11px 34px;border-radius:12px;background:#fff;color:#0c0618;box-shadow:0 6px 16px rgba(0,0,0,.22);transition:transform .08s ease}
  .cat:active{transform:scale(.97)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="hero"></div>
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="content">
      <div class="msub">IS IN TOWN</div>
      <div class="h2">AND YOU KNOW WHAT THAT M3ANS…</div>
      <div class="kara">IT'S A KARAOK3 PARTY</div>

      <div class="sp"></div>
      <div class="venuecard">
        <div class="venue">TH3 COOP3R/SAF3R HOUS3</div>
        <div class="addr">16 W3ST COLMAR CIRCL3</div>
        <div class="time">FRIDAY, JULY 31 · 7:30PM</div>
      </div>

      <div class="sp"></div>
      <div class="count" id="count" role="timer">
        <div class="u"><div class="num" id="d">--</div><div class="lab">DAYS</div></div>
        <div class="u"><div class="num" id="h">--</div><div class="lab">HRS</div></div>
        <div class="u"><div class="num" id="m">--</div><div class="lab">MIN</div></div>
        <div class="u"><div class="num" id="s">--</div><div class="lab">S3C</div></div>
      </div>
      <div class="partyMsg" id="partyMsg">🎤 IT'S SHOWTIM3 🎤</div>

      <div class="sp"></div>
      <a class="cat" href="catalog.pdf" target="_blank" rel="noopener noreferrer">🎵 CATALOG</a>
    </div>
  </div>

<script>
  var TARGET = new Date('2026-07-31T19:30:00-04:00').getTime();
  var d=document.getElementById('d'),h=document.getElementById('h'),m=document.getElementById('m'),s=document.getElementById('s'),card=document.getElementById('card');
  function pad(n){return (n<10?'0':'')+n;}
  var done=false;
  function tick(){
    var diff=TARGET-Date.now();
    if(diff<=0){ if(!done){done=true;card.classList.add('go');} return; }
    d.textContent=Math.floor(diff/86400000);
    h.textContent=pad(Math.floor(diff%86400000/3600000));
    m.textContent=pad(Math.floor(diff%3600000/60000));
    s.textContent=pad(Math.floor(diff%60000/1000));
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
