<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Megan is in Town — Karaoke Party</title>
<meta name="theme-color" content="#a12ad0">
<meta property="og:title" content="Megan is in town">
<meta property="og:description" content="It's a karaoke party. Friday, July 31 · 7:30PM · The Cooper/Safer House.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#ffd24a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:#7b2ff7;font-family:'Poppins',system-ui,-apple-system,sans-serif;color:#fff;display:flex;justify-content:center;-webkit-text-size-adjust:100%}
  .card{width:100%;max-width:460px;min-height:100svh;position:relative;overflow:hidden;
    background:linear-gradient(150deg,#ff2d95 0%,#8a2be2 46%,#22c9ff 100%);
    display:flex;flex-direction:column}
  /* soft decor blobs */
  .blob{position:absolute;border-radius:50%;z-index:0;filter:blur(1px);opacity:.5}
  .b1{width:230px;height:230px;background:radial-gradient(circle,#ff7ac1,transparent 70%);top:-40px;right:-40px}
  .b2{width:200px;height:200px;background:radial-gradient(circle,#5ce0ff,transparent 70%);bottom:60px;left:-60px}
  .confetti i{position:absolute;width:9px;height:9px;border-radius:2px;z-index:1;opacity:.9}

  .content{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:26px 22px 22px;gap:0}
  .sp{flex:1 1 0;min-height:6px;max-height:40px}

  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.24em;color:#fff}
  .h1{font-weight:800;font-size:clamp(38px,11vw,52px);line-height:1;margin-top:6px;text-shadow:2px 3px 0 rgba(0,0,0,.18)}
  .h2{font-weight:600;font-size:clamp(16px,4.6vw,19px);color:#0a0512;margin-top:8px}
  .kara{font-weight:700;font-size:clamp(13px,3.8vw,15px);letter-spacing:.12em;color:#fff;margin-top:6px}

  .mic{margin:2px 0}
  .mic img{width:clamp(74px,21vw,100px);height:auto;display:block;filter:drop-shadow(0 0 10px rgba(255,255,255,.45)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}

  .venuecard{width:100%;background:rgba(12,6,26,.42);border:1px solid rgba(255,255,255,.35);border-radius:18px;
    padding:16px 16px;backdrop-filter:blur(4px)}
  .venue{font-weight:800;font-size:clamp(23px,6.6vw,28px);line-height:1.05}
  .addr{font-weight:500;font-size:clamp(14px,4.2vw,16px);margin-top:3px;opacity:.95}
  .time{font-weight:700;font-size:clamp(17px,5vw,20px);color:var(--gold);margin-top:8px;line-height:1.25}

  .count{display:flex;gap:8px;justify-content:center}
  .u{min-width:58px;padding:9px 4px;border-radius:13px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45)}
  .num{font-size:clamp(24px,7vw,30px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .lab{font-size:9px;letter-spacing:.14em;font-weight:600;opacity:.9;margin-top:5px}
  .partyMsg{display:none;font-size:clamp(22px,6.5vw,30px);font-weight:800}
  .go .count{display:none}.go .partyMsg{display:block}

  .cta{width:100%;display:flex;flex-direction:column;gap:10px}
  .ctarow{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:15px;font-weight:700;
    padding:15px 8px;border-radius:14px;min-height:52px;transition:transform .08s ease}
  .btn:active{transform:scale(.98)}
  .btn.dark{background:#0c0618;color:#fff}
  .btn.light{background:#fff;color:#0c0618}
  .btn.full{width:100%}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="confetti" id="cf"></div>

    <div class="content">
      <div class="eyebrow">🎤 YOU'RE INVITED</div>
      <div class="h1">Megan is in town</div>
      <div class="h2">and you know what that means…</div>
      <div class="kara">IT'S A KARAOKE PARTY</div>

      <div class="sp"></div>

      <div class="mic"><img src="mic.png" alt="microphone"></div>

      <div class="sp"></div>

      <div class="venuecard">
        <div class="venue">The Cooper/Safer House</div>
        <div class="addr">16 West Colmar Circle</div>
        <div class="time">Friday, July 31 · 7:30PM</div>
      </div>

      <div class="sp"></div>

      <div class="count" id="count" role="timer">
        <div class="u"><div class="num" id="d">--</div><div class="lab">DAYS</div></div>
        <div class="u"><div class="num" id="h">--</div><div class="lab">HRS</div></div>
        <div class="u"><div class="num" id="m">--</div><div class="lab">MIN</div></div>
        <div class="u"><div class="num" id="s">--</div><div class="lab">SEC</div></div>
      </div>
      <div class="partyMsg" id="partyMsg">🎤 IT'S SHOWTIME 🎤</div>

      <div class="sp"></div>

      <div class="cta">
        <div class="ctarow">
          <a class="btn dark" href="https://docs.google.com/forms/d/e/1FAIpQLSdXw6pt8I-sNoj49kcVM5RFvls1h5ORJaTm28Fd5aVsHLuYmg/viewform" target="_blank" rel="noopener noreferrer">🎤 Sign up to sing</a>
          <a class="btn light" href="catalog.pdf" target="_blank" rel="noopener noreferrer">🎵 Catalog</a>
        </div>
        <a class="btn light full" href="https://docs.google.com/forms/d/e/1FAIpQLSeg-Vdlgb9GMbu-6boDmO_0A_dlfn6bv1JIcIz62f2Hj3n4jA/viewform" target="_blank" rel="noopener noreferrer">💌 RSVP — who's coming</a>
      </div>
    </div>
  </div>

<script>
  var TARGET = new Date('2026-07-31T19:30:00-04:00').getTime();
  var d=document.getElementById('d'),h=document.getElementById('h'),m=document.getElementById('m'),s=document.getElementById('s'),card=document.getElementById('card');
  function pad(n){return (n<10?'0':'')+n;}
  var done=false;
  function tick(){
    var diff=TARGET-Date.now();
    if(diff<=0){ if(!done){done=true;card.classList.add('go');} return; }
    d.textContent=Math.floor(diff/86400000);
    h.textContent=pad(Math.floor(diff%86400000/3600000));
    m.textContent=pad(Math.floor(diff%3600000/60000));
    s.textContent=pad(Math.floor(diff%60000/1000));
  }
  tick(); setInterval(tick,1000);
  // confetti
  var cols=['#ffd24a','#ff2d95','#22c9ff','#38e29d','#ffffff'], cf=document.getElementById('cf'), html='';
  for(var i=0;i<14;i++){ html+='<i style="left:'+((i*37+7)%100)+'%;top:'+((i*53+5)%94)+'%;background:'+cols[i%cols.length]+';transform:rotate('+((i*41)%360)+'deg)"></i>'; }
  cf.innerHTML=html;
</script>
</body>
</html>
