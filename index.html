<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M3GAN IS IN TOWN — Megan's Karaoke Party</title>
<meta name="theme-color" content="#1a0033">
<meta property="og:title" content="M3GAN IS IN TOWN">
<meta property="og:description" content="It's a karaoke party. Friday, July 31 · 7PM · The Cooper/Safer House.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#ff2d95; --cyan:#22e0ff; --gold:#ffd24a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:#0a0610;font-family:'Barlow',system-ui,-apple-system,sans-serif;color:#fff;display:flex;justify-content:center;-webkit-text-size-adjust:100%}
  .card{width:100%;max-width:460px;min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#1a0033 0%,#3a0d5c 38%,#ff2d95 116%)}

  /* image */
  .hero{position:relative;width:100%;flex:0 0 42svh;background-image:url("doll.png");background-size:cover;background-position:center 26%}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 52%,rgba(26,0,51,.92))}
  .titleblock{position:absolute;left:0;right:0;bottom:3%;z-index:2;text-align:center}
  .title{font-weight:200;font-size:clamp(46px,14vw,60px);letter-spacing:.1em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.75);line-height:1}
  .isin{font-weight:300;font-size:clamp(20px,5.6vw,25px);letter-spacing:.2em;color:#fff;line-height:1;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.8)}

  /* bottom content — evenly spread vertically */
  .content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
    text-align:center;padding:16px 22px 18px;position:relative}
  .grid7{position:absolute;left:-20%;right:-20%;bottom:0;height:62%;z-index:0;
    background-image:linear-gradient(rgba(34,224,255,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(34,224,255,.32) 1px,transparent 1px);
    background-size:26px 26px;transform:perspective(240px) rotateX(62deg);transform-origin:bottom;opacity:.4}
  .content>*{position:relative;z-index:2}

  .tag{display:flex;flex-direction:column;gap:5px}
  .sub{font-size:clamp(15px,4.4vw,18px);color:var(--gold);letter-spacing:.02em}
  .kara{font-size:clamp(12px,3.6vw,14px);font-weight:500;letter-spacing:.2em;color:var(--cyan)}

  .count{display:flex;gap:9px;justify-content:center}
  .u{min-width:62px;padding:11px 5px;border-radius:13px;background:rgba(0,0,0,.34);border:1px solid rgba(34,224,255,.4)}
  .num{font-size:clamp(26px,8vw,32px);font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
  .lab{font-size:9.5px;letter-spacing:.16em;opacity:.9;margin-top:5px}
  .partyMsg{display:none;font-size:clamp(24px,7vw,32px);font-weight:400;letter-spacing:.06em;color:#fff}
  .go .count{display:none}.go .partyMsg{display:block}

  .venue{font-weight:300;font-size:clamp(24px,7vw,29px);line-height:1.06;letter-spacing:.04em;color:#fff}
  .addr{font-size:clamp(13px,4vw,15px);opacity:.92;margin-top:2px}
  .time{font-size:clamp(16px,4.8vw,19px);font-weight:300;letter-spacing:.03em;margin-top:3px;color:var(--gold)}
  .time b{color:#fff;font-weight:500;white-space:nowrap}

  .cta{width:100%;display:flex;flex-direction:column;gap:11px}
  .ctarow{display:grid;grid-template-columns:1.4fr 1fr;gap:11px}
  .btn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;font-weight:600;color:#fff;
    letter-spacing:.03em;padding:16px 8px;border-radius:13px;min-height:54px;background:var(--pink);
    box-shadow:0 6px 16px rgba(255,45,149,.4);transition:transform .08s ease}
  .btn:active{transform:scale(.98)}
  .btn.alt{background:var(--cyan);color:#04222b}
  .btn.ghost{background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.4);box-shadow:none}
  .btn.full{width:100%}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="hero"><div class="titleblock"><div class="title">M3GAN</div><div class="isin">IS IN TOWN</div></div></div>
    <div class="content">
      <div class="grid7"></div>

      <div class="tag">
        <div class="sub">AND YOU KNOW WHAT THAT M3ANS…</div>
        <div class="kara">IT'S A KARAOK3 PARTY</div>
      </div>

      <div class="count" id="count" role="timer">
        <div class="u"><div class="num" id="d">--</div><div class="lab">DAYS</div></div>
        <div class="u"><div class="num" id="h">--</div><div class="lab">HRS</div></div>
        <div class="u"><div class="num" id="m">--</div><div class="lab">MIN</div></div>
        <div class="u"><div class="num" id="s">--</div><div class="lab">S3C</div></div>
      </div>
      <div class="partyMsg" id="partyMsg">🎤 IT'S SHOWTIM3 🎤</div>

      <div class="deets">
        <div class="venue">TH3 COOP3R/SAF3R HOUS3</div>
        <div class="addr">16 W3ST COLMAR CIRCL3</div>
        <div class="time">FRIDAY, JULY 31 · <b>7PM 'TIL DAWN</b></div>
      </div>

      <div class="cta">
        <div class="ctarow">
          <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdXw6pt8I-sNoj49kcVM5RFvls1h5ORJaTm28Fd5aVsHLuYmg/viewform" target="_blank" rel="noopener noreferrer">SIGN UP TO SING</a>
          <a class="btn alt" href="catalog.pdf" target="_blank" rel="noopener noreferrer">CATALOG</a>
        </div>
        <a class="btn ghost full" href="rsvp.html">RSVP — WHO'S COMING</a>
      </div>
    </div>
  </div>

<script>
  var TARGET = new Date('2026-07-31T19:00:00-04:00').getTime();
  var d=document.getElementById('d'),h=document.getElementById('h'),m=document.getElementById('m'),s=document.getElementById('s'),card=document.getElementById('card');
  function pad(n){return (n<10?'0':'')+n;}
  var done=false;
  function tick(){
    var diff=TARGET-Date.now();
    if(diff<=0){ if(!done){done=true;card.classList.add('go');} return; }
    d.textContent=Math.floor(diff/86400000);
    h.textContent=pad(Math.floor(diff%86400000/3600000));
    m.textContent=pad(Math.floor(diff%3600000/60000));
    s.textContent=pad(Math.floor(diff%60000/1000));
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
