<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEM — Megan's Party</title>
<meta name="description" content="GEM is MEG spelled backwards. Save the date: Saturday, August 1 at 7PM.">
<meta property="og:title" content="GEM — you're invited">
<meta property="og:description" content="GEM is MEG, backwards. Grab the mic. Saturday, August 1 · 7PM.">
<meta name="theme-color" content="#0a0512">
<style>
  :root{
    --bg:#0a0512; --pink:#ff2d95; --cyan:#22e0ff; --gold:#ffd24a;
    --ink:#fdf4ff;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #2a0f3d 0%, rgba(42,15,61,0) 55%),
      radial-gradient(90% 60% at 50% 120%, #17123a 0%, rgba(23,18,58,0) 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100svh; overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:36px 20px 48px; position:relative;
  }
  /* spotlight */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(60% 45% at 50% 30%, rgba(255,45,149,.16), transparent 70%);
  }
  .stage{position:relative; z-index:2; width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center}
  .eyebrow{
    letter-spacing:.5em; font-size:13px; font-weight:700; text-transform:uppercase;
    color:var(--cyan); opacity:.85; margin-bottom:14px; padding-left:.5em;
    text-shadow:0 0 12px rgba(34,224,255,.6);
  }
  .gemwrap{position:relative; line-height:.86; margin:2px 0 4px}
  .gem{
    font-size:clamp(90px,30vw,180px); font-weight:900; letter-spacing:.04em;
    color:#fff;
    text-shadow:
      0 0 6px #fff,
      0 0 22px var(--pink),
      0 0 46px var(--pink),
      0 0 86px rgba(255,45,149,.7);
    animation:flicker 5.5s infinite;
  }
  /* mirrored ghost of MEG underneath — encodes the "backwards" gag */
  .ghost{
    position:absolute; left:0; right:0; top:100%;
    font-size:clamp(90px,30vw,180px); font-weight:900; letter-spacing:.04em;
    color:transparent; line-height:.86;
    transform:scaleY(-1); transform-origin:top;
    background:linear-gradient(rgba(34,224,255,.28), transparent 62%);
    -webkit-background-clip:text; background-clip:text;
    opacity:.5; pointer-events:none; filter:blur(.3px);
  }
  @keyframes flicker{
    0%,18%,22%,25%,53%,57%,100%{opacity:1}
    20%,24%,55%{opacity:.72}
  }
  .reveal{
    margin-top:20px; font-size:clamp(17px,4.6vw,22px); font-weight:700; color:var(--ink);
  }
  .reveal b{color:var(--gold); text-shadow:0 0 14px rgba(255,210,74,.5)}
  .flip{display:inline-block}
  .sub{margin-top:8px; font-size:15px; color:#c9b8dd; letter-spacing:.02em}

  /* microphone */
  .mic{margin:26px 0 6px; width:96px; height:auto; filter:drop-shadow(0 0 22px rgba(255,45,149,.55)); animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  /* countdown */
  .count{display:flex; gap:10px; margin:22px 0 6px; flex-wrap:nowrap; justify-content:center}
  .unit{
    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1px solid rgba(255,45,149,.35);
    border-radius:16px; padding:14px 6px 10px; min-width:70px; flex:1 1 0; max-width:88px;
    box-shadow:0 0 22px rgba(255,45,149,.15), inset 0 0 18px rgba(34,224,255,.05);
    backdrop-filter:blur(4px);
  }
  .num{font-size:clamp(30px,9vw,46px); font-weight:900; font-variant-numeric:tabular-nums; color:#fff; text-shadow:0 0 16px rgba(34,224,255,.5); line-height:1}
  .lab{margin-top:8px; font-size:10.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--cyan); padding-left:.28em}
  .when{margin-top:26px; font-size:clamp(16px,4.4vw,20px); font-weight:800; letter-spacing:.06em; color:#fff}
  .when span{color:var(--pink)}
  .tag{margin-top:10px; font-size:14px; color:#b7a6cc}
  .live{margin-top:22px; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:#7d6f93}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:#33ff99; margin-right:7px; box-shadow:0 0 8px #33ff99; animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* floating notes */
  .note{position:fixed; bottom:-40px; z-index:1; font-size:22px; opacity:.0; color:var(--cyan); animation:rise linear infinite; pointer-events:none}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-115svh) rotate(220deg);opacity:0}}

  /* party mode (after countdown hits 0) */
  .party .count,.party .live{display:none}
  .partyMsg{display:none; margin-top:18px; font-size:clamp(22px,7vw,34px); font-weight:900; color:#fff; text-shadow:0 0 20px var(--pink)}
  .party .partyMsg{display:block; animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="eyebrow">Save the date</div>

    <div class="gemwrap">
      <div class="gem">GEM</div>
      <div class="ghost" aria-hidden="true">GEM</div>
    </div>

    <div class="reveal">that's <b><span class="flip">MEG</span></b> &mdash; spelled backwards 🪞</div>
    <div class="sub">It's Megan's party. And yeah, there's a mic.</div>

    <!-- Microphone -->
    <svg class="mic" viewBox="0 0 64 132" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="microphone">
      <defs>
        <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff8ac4"/><stop offset="1" stop-color="#ff2d95"/>
        </linearGradient>
        <linearGradient id="st" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e9e9ef"/><stop offset="1" stop-color="#9aa0b5"/>
        </linearGradient>
      </defs>
      <rect x="27" y="70" width="10" height="40" rx="5" fill="url(#st)"/>
      <path d="M14 96 a18 18 0 0 0 36 0" stroke="#c9cede" stroke-width="4" fill="none"/>
      <rect x="20" y="108" width="24" height="8" rx="4" fill="#c9cede"/>
      <rect x="16" y="4" width="32" height="74" rx="16" fill="url(#mg)"/>
      <g stroke="rgba(0,0,0,.25)" stroke-width="2">
        <line x1="22" y1="16" x2="42" y2="16"/><line x1="22" y1="24" x2="42" y2="24"/>
        <line x1="22" y1="32" x2="42" y2="32"/><line x1="22" y1="40" x2="42" y2="40"/>
      </g>
      <ellipse cx="26" cy="20" rx="4" ry="8" fill="rgba(255,255,255,.55)"/>
    </svg>

    <div class="count" id="count" role="timer" aria-live="off">
      <div class="unit"><div class="num" id="d">--</div><div class="lab">Days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="lab">Hrs</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="lab">Min</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="lab">Sec</div></div>
    </div>

    <div class="partyMsg" id="partyMsg">🎤 IT'S GEM TIME 🎤</div>

    <div class="when">SATURDAY · <span>AUGUST 1</span> · 7:00 PM</div>
    <div class="tag">Grab the mic. Bring your voice.</div>
    <div class="live"><span class="dot"></span>Live countdown</div>
  </div>

<script>
  // Absolute target instant: Sat Aug 1, 2026, 7:00 PM Eastern (EDT, -04:00)
  var TARGET = new Date('2026-08-01T19:00:00-04:00').getTime();
  var d=document.getElementById('d'),h=document.getElementById('h'),
      m=document.getElementById('m'),s=document.getElementById('s'),
      stage=document.getElementById('stage');
  function pad(n){return (n<10?'0':'')+n;}
  var done=false;
  function tick(){
    var diff = TARGET - Date.now();
    if(diff<=0){
      if(!done){done=true; stage.classList.add('party');}
      return;
    }
    d.textContent = Math.floor(diff/86400000);
    h.textContent = pad(Math.floor(diff%86400000/3600000));
    m.textContent = pad(Math.floor(diff%3600000/60000));
    s.textContent = pad(Math.floor(diff%60000/1000));
  }
  tick(); setInterval(tick,1000);

  // floating music notes
  var notes=['♪','♫','🎶','♩','🎤'];
  for(var i=0;i<9;i++){
    var el=document.createElement('div'); el.className='note';
    el.textContent=notes[i%notes.length];
    el.style.left=(6+i*11)+'%';
    el.style.animationDuration=(11+(i%5)*3)+'s';
    el.style.animationDelay=(i*1.3)+'s';
    el.style.fontSize=(16+(i%4)*7)+'px';
    document.body.appendChild(el);
  }
</script>
</body>
</html>
