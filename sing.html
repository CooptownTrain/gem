<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up to sing — Karaoke Night</title><meta name="theme-color" content="#0a0512">
<style>
  :root{ --bg:#0a0512; --pink:#ff2d95; --cyan:#22e0ff; --gold:#ffd24a; --ink:#fdf4ff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #2a0f3d 0%, rgba(42,15,61,0) 55%),
      radial-gradient(90% 60% at 50% 120%, #17123a 0%, rgba(23,18,58,0) 60%),
      var(--bg);
    color:var(--ink); font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px 18px 22px; text-align:center; -webkit-text-size-adjust:100%; overflow-x:hidden;
  }
  .shell{width:100%; max-width:440px; position:relative; z-index:2}
  .shell > *{max-width:100%; overflow-wrap:break-word}
  .eyebrow{letter-spacing:.34em; font-size:12px; font-weight:700; text-transform:uppercase; color:var(--cyan); text-shadow:0 0 12px rgba(34,224,255,.55); padding-left:.34em}
  a{color:var(--cyan)}

  /* hero headline */
  .h1{font-size:clamp(26px,6.8vw,36px); font-weight:900; letter-spacing:.01em; color:#fff; line-height:1.05; margin-top:8px;
    text-shadow:0 0 6px rgba(255,255,255,.5), 0 0 26px rgba(255,45,149,.6)}
  .h2{font-size:clamp(15px,4.2vw,19px); font-weight:700; color:var(--gold); margin-top:8px; text-shadow:0 0 14px rgba(255,210,74,.4)}
  .karaoke{font-size:14px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--pink); margin-top:8px; text-shadow:0 0 14px rgba(255,45,149,.5)}

  /* countdown (compact) */
  .count{display:flex; gap:8px; margin:14px 0 4px; justify-content:center}
  .unit{background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border:1px solid rgba(255,45,149,.35);
    border-radius:12px; padding:8px 3px 6px; flex:1 1 0; max-width:74px; box-shadow:0 0 18px rgba(255,45,149,.12)}
  .num{font-size:clamp(22px,6.5vw,30px); font-weight:900; font-variant-numeric:tabular-nums; color:#fff; text-shadow:0 0 12px rgba(34,224,255,.5); line-height:1}
  .lab{margin-top:5px; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); padding-left:.2em}
  .partyMsg{display:none; margin-top:10px; font-size:clamp(20px,6vw,28px); font-weight:900; color:#fff; text-shadow:0 0 20px var(--pink)}
  .party .count{display:none}.party .partyMsg{display:block}

  .when{margin-top:14px; font-size:clamp(15px,4.4vw,19px); font-weight:800; letter-spacing:.04em; color:#fff}
  .when span{color:var(--pink)}
  .where{font-size:13.5px; line-height:1.5; color:#e7d6f2; margin-top:6px}
  .where b{color:var(--cyan); font-weight:800}

  /* buttons */
  .btnrow{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:18px}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; text-align:center;
    font-size:15px; font-weight:800; letter-spacing:.01em; line-height:1.15; color:#fff; padding:14px 10px; border-radius:14px;
    min-height:54px; border:1px solid rgba(255,45,149,.4);
    background:linear-gradient(180deg, rgba(255,45,149,.22), rgba(255,45,149,.08));
    box-shadow:0 0 20px rgba(255,45,149,.12); transition:transform .08s ease}
  .btn:active{transform:scale(.98)}
  .btn.alt{border-color:rgba(34,224,255,.4); background:linear-gradient(180deg, rgba(34,224,255,.16), rgba(34,224,255,.05)); box-shadow:0 0 20px rgba(34,224,255,.1)}
  .btn.full{margin-top:11px; width:100%}
  .btn .em{font-size:19px}

  .invitelink{display:inline-block; margin-top:18px; font-size:14px; font-weight:700; color:#b9a9cf; text-decoration:none; border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:9px 18px}
  .invitelink:hover{color:#fff; border-color:var(--cyan)}
  .topbar{text-align:left; margin-bottom:6px}
  .topback{display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:800; color:#fff; text-decoration:none;
    border:1px solid rgba(34,224,255,.4); background:linear-gradient(180deg, rgba(34,224,255,.16), rgba(34,224,255,.05));
    border-radius:999px; padding:9px 16px; min-height:40px}
  .topback:active{transform:scale(.98)}

  /* forms */
  form{margin-top:20px; text-align:left; display:flex; flex-direction:column; gap:15px}
  label{display:block; font-size:14px; font-weight:700; color:var(--cyan); margin-bottom:7px; letter-spacing:.02em}
  .req{color:var(--pink)}
  input, textarea{width:100%; font-size:16px; font-family:inherit; color:#fff; padding:14px; border-radius:12px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); outline:none}
  input:focus, textarea:focus{border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,45,149,.18)}
  input::placeholder, textarea::placeholder{color:#8f82a6}
  textarea{min-height:84px; resize:vertical}
  .submit{margin-top:4px; font-size:18px; font-weight:900; letter-spacing:.03em; color:#0a0512; background:linear-gradient(180deg,#ffd24a,#ff9e2d);
    border:none; border-radius:14px; padding:17px; min-height:56px; cursor:pointer; box-shadow:0 8px 22px rgba(255,158,45,.3)}
  .submit:active{transform:scale(.99)}
  .lead{font-size:14.5px; color:#cbbce0; margin-top:8px; line-height:1.5}
  .pagetitle{font-size:clamp(28px,8vw,40px); font-weight:900; color:#fff; line-height:1; margin-top:4px; text-shadow:0 0 20px rgba(255,45,149,.4)}
  .card2{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:20px 18px 22px; margin-top:16px}
  .catbtn{display:inline-flex; align-items:center; gap:8px; margin-top:12px; text-decoration:none; font-size:15px; font-weight:800; color:#fff;
    border:1px solid rgba(34,224,255,.45); background:linear-gradient(180deg, rgba(34,224,255,.16), rgba(34,224,255,.05));
    border-radius:12px; padding:12px 18px; min-height:48px; box-shadow:0 0 18px rgba(34,224,255,.1)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div class="shell">
  <div class="topbar"><a class="topback" href="index.html">← Back to invite</a></div>
  <div class="eyebrow">Karaoke · Jul 31</div>
  <div class="pagetitle">Sign up to sing 🎤</div>
  <div class="lead">Claim your song(s). We'll have them queued up on the night.</div>
  <a class="catbtn" href="catalog.pdf" target="_blank" rel="noopener noreferrer">🎵 Browse the song catalog</a>
  <div class="card2">
  <form action="https://formsubmit.co/cooper18c@gmail.com" method="POST">
    
    <input type="hidden" name="_subject" value="🎤 New song sign-up">
    <input type="hidden" name="_cc" value="jsaferpr@gmail.com">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://cooptowntrain.github.io/gem/thanks.html">
    <div>
      <label>Your name <span class="req">*</span></label>
      <input type="text" name="Singer name" placeholder="e.g. Jamie Rivera" required>
    </div>
    <div>
      <label>Song #1 — title <span class="req">*</span></label>
      <input type="text" name="Song 1 title" placeholder="Don't Stop Believin'" required>
    </div>
    <div>
      <label>Song #1 — artist</label>
      <input type="text" name="Song 1 artist" placeholder="Journey">
    </div>
    <div>
      <label>Song #2 — title (optional)</label>
      <input type="text" name="Song 2 title" placeholder="A backup, just in case">
    </div>
    <div>
      <label>Song #2 — artist (optional)</label>
      <input type="text" name="Song 2 artist" placeholder="">
    </div>
    <button class="submit" type="submit">Add me to the mic 🎤</button>
  </form>
  </div>
  <a class="invitelink" href="index.html">← Return to invite</a></div></body></html>
