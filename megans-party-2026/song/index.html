<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Megan's Karaoke Party — Add Your Song</title>
<meta name="theme-color" content="#8a2be2">
<meta property="og:title" content="Megan's Karaoke Party 🎤">
<meta property="og:description" content="Friday, July 31 · 7:30PM · The Cooper/Safer House. Tap to add your song!">
<meta property="og:image" content="https://cooptowntrain.github.io/gem/megans-party-2026/song/og.jpg">
<meta property="og:image:width" content="1080">
<meta property="og:image:height" content="1350">

<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Megan's Karaoke Party 🎤">
<meta name="twitter:description" content="Friday, July 31 · 7:30PM · The Cooper/Safer House. Tap to add your song!">
<meta name="twitter:image" content="https://cooptowntrain.github.io/gem/megans-party-2026/song/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#ffd24a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:#8a2be2;font-family:'Poppins',system-ui,-apple-system,sans-serif;color:#fff;display:flex;justify-content:center;-webkit-text-size-adjust:100%}
  .card{width:100%;max-width:460px;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
    padding:34px 24px 30px;background:linear-gradient(150deg,#ff2d95 0%,#8a2be2 48%,#22c9ff 100%)}
  .eyebrow{font-weight:700;font-size:12px;letter-spacing:.26em;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .mic{width:clamp(78px,22vw,96px);height:auto;margin:6px 0 2px;
    filter:invert(1) drop-shadow(0 0 12px rgba(255,255,255,.55)) drop-shadow(0 5px 9px rgba(0,0,0,.35))}
  .title{font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1;text-shadow:2px 3px 0 rgba(0,0,0,.18)}
  .kara{font-weight:700;font-size:clamp(13px,4vw,15px);color:#ffe9a8;letter-spacing:.06em;margin-top:5px}
  .hgroup{display:flex;flex-direction:column;align-items:center;gap:6px}
  .venue{width:100%;background:rgba(12,6,26,.44);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:15px 16px}
  .venue .v{font-weight:800;font-size:clamp(19px,5.6vw,22px);line-height:1.1}
  .venue .a{font-weight:500;font-size:clamp(13px,3.8vw,14px);opacity:.95;margin-top:3px}
  .venue .t{font-weight:700;font-size:clamp(15px,4.6vw,17px);color:var(--gold);margin-top:6px}
  .add{width:100%;background:#fff;color:#0c0618;border-radius:18px;padding:18px 18px;box-shadow:0 14px 30px rgba(0,0,0,.3)}
  .add h2{font-size:13px;font-weight:800;color:#7b2ff7;letter-spacing:.02em}
  .add p{font-size:14px;font-weight:600;color:#3a2a55;margin:8px 0 14px;line-height:1.35}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;text-decoration:none;
    font-size:18px;font-weight:800;border-radius:14px;background:#7b2ff7;color:#fff;box-shadow:0 8px 20px rgba(123,47,247,.4);transition:transform .08s ease}
  .btn:active{transform:scale(.98)}
  .url{font-size:12px;font-weight:700;color:#7b2ff7;margin-top:9px}
  .foot{font-weight:600;font-size:12.5px;opacity:.95;text-shadow:0 1px 5px rgba(0,0,0,.4)}
  .foot a{color:#ffe9a8;text-decoration:none;font-weight:700}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="card">
    <div class="hgroup">
      <div class="eyebrow">🎤 YOU'RE INVITED</div>
      <img class="mic" src="mic.png" alt="microphone">
      <div class="title">Megan is in town</div>
      <div class="kara">IT'S A KARAOKE PARTY</div>
    </div>

    <div class="venue">
      <div class="v">The Cooper/Safer House</div>
      <div class="a">16 West Colmar Circle</div>
      <div class="t">Friday, July 31 · 7:30PM</div>
    </div>

    <div class="add">
      <h2>🎶 ADD YOUR SONG</h2>
      <p>Tap below, search for your song, and add it to the queue.</p>
      <a class="btn" href="https://www.karafun.com/793760" target="_blank" rel="noopener noreferrer">🎶 Add my song</a>
      <div class="url">karafun.com/793760</div>
    </div>

    <div class="foot">🎤 See the full invite → <a href="https://cooptowntrain.github.io/gem/megans-party-2026/" target="_blank" rel="noopener noreferrer">party page</a></div>
  </div>
</body>
</html>
